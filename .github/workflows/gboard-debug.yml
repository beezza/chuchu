name: Gboard debug APK

on:
  push:
    branches: [fix/gboard-hardware-ime]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_SIGNING_CERT_SHA256: 1f5e1ca438aedc3722e0e396cf2abf40db60ee4bc7db227b36d9572868676494
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Verify Android signing tool
        run: nix develop -c bash -c '"$ANDROID_HOME/build-tools/35.0.0/apksigner" version'

      - name: Test Android input handling
        run: nix develop -c bash -c 'cd android && ./gradlew :app:testDebugUnitTest'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gboard-test-reports
          path: android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Build native SSH and terminal library
        run: nix develop -c bash -c 'cd zig-src && zig build -Doptimize=ReleaseSmall -Dtarget=aarch64-linux-android.24 jni'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/key.jks

      - name: Set build version
        run: |
          echo "VERSION_CODE=$((201000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.2.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_ABI_FILTERS: arm64-v8a
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: nix develop -c bash -c 'cd android && ./gradlew :app:assembleDebug'

      - name: Verify native library is packaged
        run: unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -F 'lib/arm64-v8a/libchuchu_jni.so'

      - name: Verify fixed signing certificate
        run: |
          set -euo pipefail
          actual="$(nix develop -c bash -c '
            set -euo pipefail
            apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
            test -x "$apksigner"
            "$apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          ' | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          if [ "${actual,,}" != "$EXPECTED_SIGNING_CERT_SHA256" ]; then
            echo "::error::Unexpected signing certificate: ${actual:-missing}"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: chuchu-gboard-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
